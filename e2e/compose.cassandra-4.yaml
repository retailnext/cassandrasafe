---
# Two-node Cassandra 4.x cluster for the end-to-end smoke test.
# Renovate keeps the image at the newest release of this major.
name: cassandrasafe-e2e
services:
  node1:
    image: cassandra:4.1.12@sha256:f7d6cad74cf00862949f7e5c29cd88204393583cbf752800764ce0c05acb1a37
    container_name: cassandrasafe-e2e-node1
    environment:
      CASSANDRA_CLUSTER_NAME: cassandrasafe-e2e
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
  node2:
    image: cassandra:4.1.12@sha256:f7d6cad74cf00862949f7e5c29cd88204393583cbf752800764ce0c05acb1a37
    container_name: cassandrasafe-e2e-node2
    environment:
      CASSANDRA_CLUSTER_NAME: cassandrasafe-e2e
      CASSANDRA_SEEDS: node1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    depends_on:
      node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
