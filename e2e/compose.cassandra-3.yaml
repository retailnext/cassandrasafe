---
# Two-node Cassandra 3.x cluster for the end-to-end smoke test.
# Renovate keeps the image at the newest release of this major.
name: cassandrasafe-e2e
services:
  node1:
    image: cassandra:3.11.19@sha256:9a14b18eb658851e8939cfdeca8fcbca389f5f0d00fca4a995d80b6accfcbd96
    container_name: cassandrasafe-e2e-node1
    environment:
      CASSANDRA_CLUSTER_NAME: cassandrasafe-e2e
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
  node2:
    image: cassandra:3.11.19@sha256:9a14b18eb658851e8939cfdeca8fcbca389f5f0d00fca4a995d80b6accfcbd96
    container_name: cassandrasafe-e2e-node2
    environment:
      CASSANDRA_CLUSTER_NAME: cassandrasafe-e2e
      CASSANDRA_SEEDS: node1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    depends_on:
      node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
